name: Build OhMyInsets (roothide / iOS 17 safe)

on:
  push:
    branches: [ main, release ]
  workflow_dispatch:

env:
  FINALPACKAGE: 1
  THEOS_PACKAGE_SCHEME: roothide
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Install build tools
      run: |
        brew install ldid-procursus make xz 2>/dev/null || true

    # theos 必须放在 $GITHUB_WORKSPACE 下（runner 对 /opt 没有写权限）
    - name: Checkout roothide/theos
      uses: actions/checkout@v5
      with:
        repository: roothide/theos
        path: theos-roothide
        submodules: recursive

    - name: Install iOS SDK
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos-roothide"
        cd "$THEOS"
        ./bin/install-sdk iPhoneOS16.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build roothide package
      id: build
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos-roothide"
        export THEOS_PACKAGE_SCHEME=roothide
        gmake clean package FINALPACKAGE=1 2>&1 | tee build.log
        test -n "$(find packages -name '*.deb' -print -quit)"

    - name: Verify dylib dependencies (roothide install-name)
      if: always()
      run: |
        DYLIB=$(find .theos -name 'UIStatusBarWidthAdjust.dylib' -print -quit 2>/dev/null || true)
        if [ -n "$DYLIB" ]; then
          otool -L "$DYLIB" | sed -n '2,40p' | while IFS= read -r line; do
            echo "::warning title=dylib dep::$line"
          done
          if otool -L "$DYLIB" | grep -q 'CydiaSubstrate.framework'; then
            echo "::error title=bad dylib dep::CydiaSubstrate.framework 仍被引用，roothide 上会静默不加载"
          fi
        else
          echo "::warning title=dylib dep::未找到 .theos 下的 dylib"
        fi

    # 无鉴权读取编译错误：::error:: 会生成公开可读的 Annotation
    - name: Surface compiler errors
      if: always()
      run: |
        if [ -f build.log ]; then
          grep -E "error:|fatal error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=compile error::$line"
          done
          echo "::notice title=build log tail::$(tail -n 20 build.log | tr '\n' ' ')"
        fi

    - name: Collect packages
      if: always()
      run: |
        mkdir -p artifacts
        find packages -name '*.deb' -exec cp {} artifacts/ \; 2>/dev/null || true
        [ -f build.log ] && cp build.log artifacts/ || true
        ls -la artifacts

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: ohmyinsets-roothide-ios17
        path: artifacts/
        if-no-files-found: warn
